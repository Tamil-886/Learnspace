<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Co-Op Community – LearnSpace</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/classes.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/rtl.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/animations.css">
  <!-- Pre-apply theme & text direction immediately to prevent flash -->
  <script src="../js/theme.js"></script>
  <script src="../js/direction.js"></script>
</head>
<body>
  <div class="auth-standalone-wrapper">
    <!-- Standalone Top Utility Bar -->
    <header class="auth-top-bar">
      <a href="../index.html" class="auth-back-link" title="Return to Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Back to Home</span>
      </a>

      <div class="auth-top-controls">
        <!-- Theme Toggle -->
        <button class="theme-toggle-btn" aria-label="Toggle dark/light theme" title="Toggle Theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <!-- Direction Toggle -->
        <button class="dir-toggle-btn" aria-label="Toggle text direction" title="Toggle LTR/RTL">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="8 17 12 21 16 17"/><polyline points="8 7 12 3 16 7"/><line x1="12" y1="3" x2="12" y2="21"/></svg> <span class="dir-label">RTL</span>
        </button>
      </div>
    </header>

    <main class="auth-center-content">
      <div class="auth-card animate-fade-in" style="max-width: 540px;">
        <div class="auth-header">
          <a href="../index.html" class="auth-logo">
            <img src="../assets/images/logo/logo.svg" alt="LearnSpace" style="height: 44px;" class="logo-img-dark" />
            <img src="../assets/images/logo/logo-light.svg" alt="LearnSpace" style="height: 44px; display: none;" class="logo-img-light" />
          </a>
          <h1 class="auth-title">Family Membership Application</h1>
          <p class="auth-subtitle">Join 150+ homeschool families collaborating in educational excellence.</p>
        </div>

      <div id="register-feedback-banner" class="auth-banner" role="alert"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="reg-name" class="form-label">Parent / Guardian Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Sarah Jenkins" required />
        </div>

        <div class="grid grid-cols-2" style="gap: 16px;">
          <div class="form-group">
            <label for="reg-email" class="form-label">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="sarah@example.com" required />
          </div>

          <div class="form-group">
            <label for="reg-phone" class="form-label">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="(555) 000-0000" required />
          </div>
        </div>

        <div class="grid grid-cols-2" style="gap: 16px;">
          <div class="form-group">
            <label for="reg-password" class="form-label">Create Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 chars" required />
          </div>

          <div class="form-group">
            <label for="reg-confirm-password" class="form-label">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat password" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Planned Membership Level</label>
          <select id="reg-tier" class="form-select">
            <option value="full">Full Co-Op Member (Weekly Classes + Library + Events)</option>
            <option value="resource">Resource Center & Library Pass (Lending + Fairs)</option>
            <option value="supporter">Co-Op Community Supporter</option>
          </select>
        </div>

        <div class="form-group">
          <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 0.8rem; cursor: pointer;">
            <input type="checkbox" id="reg-terms" required style="margin-top: 3px;" />
            <span>I agree to the LearnSpace Co-Op Family Honor Code, safety policies, and volunteer contribution commitments.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Submit Membership Application
        </button>
      </form>

      <div class="auth-footer">
        Already a registered member? <a href="login.html">Log in here</a>
      </div>
    </div>
    </main>

    <!-- Minimal Bottom Bar -->
    <footer class="auth-bottom-bar">
      &copy; <span class="current-year">2026</span> LearnSpace Homeschool Co-Op &amp; Resource Center. All rights reserved.
    </footer>
  </div>

  <!-- Scripts -->
  <script src="../js/storage.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
