<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Ambient circles -->
  <circle cx="400" cy="180" r="160" fill="url(#glow)"/>
  <circle cx="720" cy="80" r="100" fill="#2563EB" opacity="0.08"/>
  <circle cx="80" cy="420" r="120" fill="#3B82F6" opacity="0.06"/>
  
  <!-- Central Vector Illustration -->
  
        <g transform="translate(360, 180)">
          <rect x="-60" y="-50" width="100" height="130" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="5"/>
          <line x1="-40" y1="-25" x2="20" y2="-25" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
          <line x1="-40" y1="-5" x2="20" y2="-5" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
          <line x1="-40" y1="15" x2="10" y2="15" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
          <line x1="-40" y1="35" x2="20" y2="35" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
          <path d="M20 70 L90 -30 L110 -10 L40 90 Z" fill="#F8FAFC"/>
          <path d="M15 85 L20 70 L40 90 Z" fill="#2563EB"/>
          <circle cx="85" cy="-15" r="4" fill="#3B82F6"/>
        </g>
  
  <!-- Banner badge -->
  <g transform="translate(60, 50)">
    <rect width="140" height="32" rx="16" fill="#7C3AED" opacity="0.2"/>
    <rect width="140" height="32" rx="16" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="70" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1">EDUCATIONAL GUIDE</text>
  </g>
  
  <!-- Bottom info bar -->
  <rect x="0" y="380" width="800" height="120" fill="#030712" fill-opacity="0.8"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="425" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Navigating College Admissions as a Homeschooler</text>
  <text x="60" y="455" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">Transcripts, dual enrollment & recommendation letters</text>
  
  <!-- Brand logo micro in bottom right -->
  <g transform="translate(680, 420)">
    <circle cx="20" cy="20" r="18" fill="#2563EB"/>
    <path d="M12 24V16L20 12L28 16V24" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  </g>
</svg>