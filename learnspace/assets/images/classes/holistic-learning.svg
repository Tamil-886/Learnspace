    <text x="250" y="70" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Holistic Inquiry & Discovery</text>
    <text x="250" y="105" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#2DD4BF" text-anchor="middle">Multi-Age Collaborative Homeschool Tracks</text>
    <line x1="80" y1="135" x2="420" y2="135" stroke="#334155" stroke-width="2"/>
    
    <!-- Icons / Subjects row -->
    <g transform="translate(60, 160)">
