      <text x="40" y="47" font-size="22" text-anchor="middle">🔬</text>
      <text x="40" y="90" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Science Lab</text>
    </g>
    <g transform="translate(160, 160)">
      <circle cx="40" cy="40" r="32" fill="#2563EB" fill-opacity="0.3"/>
      <text x="40" y="47" font-size="22" text-anchor="middle">📐</text>
      <text x="40" y="90" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Mathematics</text>
    </g>
    <g transform="translate(260, 160)">
      <circle cx="40" cy="40" r="32" fill="#D97706" fill-opacity="0.3"/>
      <text x="40" y="47" font-size="22" text-anchor="middle">🎨</text>
      <text x="40" y="90" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Fine Arts</text>
    </g>
    <g transform="translate(360, 160)">
      <circle cx="40" cy="40" r="32" fill="#059669" fill-opacity="0.3"/>
      <text x="40" y="47" font-size="22" text-anchor="middle">🌿</text>
      <text x="40" y="90" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Nature Study</text>
