<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad_hl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow_hl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad_hl)"/>
  <circle cx="400" cy="220" r="180" fill="url(#glow_hl)"/>
  <circle cx="680" cy="120" r="100" fill="#14B8A6" opacity="0.1"/>
  
  <!-- Content Card overlay -->
  <g transform="translate(150, 80)">
