<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="700" height="550">
  <defs>
    <linearGradient id="heroG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- Decorative backdrop shapes -->
  <rect x="50" y="40" width="600" height="470" rx="30" fill="url(#heroG)" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 6"/>
  
  <!-- Central main desk & co-op workspace graphic -->
  <rect x="100" y="320" width="500" height="15" rx="6" fill="#1E293B"/>
  <rect x="130" y="335" width="20" height="120" rx="4" fill="#334155"/>
  <rect x="550" y="335" width="20" height="120" rx="4" fill="#334155"/>
  
  <!-- Laptop on desk -->
  <rect x="180" y="240" width="130" height="80" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="3"/>
  <rect x="190" y="250" width="110" height="60" rx="4" fill="#1E293B"/>
  <path d="M210 280 L230 265 L250 285 L280 260" fill="none" stroke="#60A5FA" stroke-width="3"/>
  <rect x="165" y="318" width="160" height="6" rx="3" fill="#64748B"/>
  
  <!-- Books stack -->
  <rect x="350" y="300" width="120" height="20" rx="4" fill="#2563EB"/>
  <rect x="360" y="280" width="100" height="20" rx="4" fill="#3B82F6"/>
  <rect x="375" y="260" width="70" height="20" rx="4" fill="#60A5FA"/>
  
  <!-- Microscope / Science tool -->
  <g transform="translate(480, 220)">
    <path d="M30 100 L70 100" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 100 L50 40 Q50 15 20 20 L10 5" stroke="#3B82F6" stroke-width="6" fill="none"/>
    <rect x="-5" y="-10" width="25" height="40" rx="4" fill="#1E293B" stroke="#60A5FA" stroke-width="2" transform="rotate(25)"/>
    <circle cx="50" cy="50" r="10" fill="#93C5FD"/>
  </g>
  
  <!-- Floating Stat Cards -->
  <!-- Stat 1: 150+ Families -->
  <g transform="translate(70, 90)">
    <rect width="180" height="80" rx="16" fill="#FFFFFF" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.1))"/>
    <rect width="180" height="80" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="22" fill="#EFF6FF"/>
    <path d="M25 45 C25 35 45 35 45 45 Z" fill="#2563EB"/>
    <circle cx="35" cy="30" r="8" fill="#2563EB"/>
    <text x="70" y="35" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#0F172A">150+ Families</text>
    <text x="70" y="55" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Active Co-op Members</text>
  </g>
  
  <!-- Stat 2: 45+ Classes -->
  <g transform="translate(460, 110)">
    <rect width="170" height="80" rx="16" fill="#FFFFFF" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.1))"/>
    <rect width="170" height="80" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="22" fill="#EFF6FF"/>
    <polygon points="35,26 44,45 26,45" fill="#3B82F6"/>
    <text x="70" y="35" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#0F172A">45+ Classes</text>
    <text x="70" y="55" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">STEM, Arts & More</text>
  </g>
  
  <!-- Stat 3: 5.0 Rating -->
  <g transform="translate(390, 420)">
    <rect width="190" height="70" rx="16" fill="#0F172A" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.2))"/>
    <circle cx="35" cy="35" r="18" fill="#1E293B"/>
    <text x="35" y="40" font-family="'Inter', sans-serif" font-size="16" fill="#F59E0B" text-anchor="middle">★</text>
    <text x="65" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">4.9 / 5.0 Stars</text>
    <text x="65" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8">From 300+ Reviews</text>
  </g>
</svg>