<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="700" height="550">
  <defs>
    <linearGradient id="heroAltG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="660" height="510" rx="28" fill="url(#heroAltG)" stroke="#334155" stroke-width="2"/>
  
  <!-- Dashboard preview inside hero -->
  <g transform="translate(60, 60)">
    <rect width="580" height="420" rx="16" fill="#0B1120" stroke="#2563EB" stroke-width="2"/>
    <!-- Dashboard header bar -->
    <rect width="580" height="50" rx="16" fill="#111827"/>
    <circle cx="30" cy="25" r="6" fill="#EF4444"/>
    <circle cx="50" cy="25" r="6" fill="#F59E0B"/>
    <circle cx="70" cy="25" r="6" fill="#10B981"/>
    <text x="290" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">LearnSpace Parent Dashboard Demo</text>
    
    <!-- Sidebar preview -->
    <rect x="15" y="65" width="130" height="340" rx="8" fill="#111827"/>
    <rect x="25" y="85" width="110" height="24" rx="6" fill="#2563EB"/>
    <rect x="25" y="120" width="90" height="15" rx="4" fill="#334155"/>
    <rect x="25" y="145" width="80" height="15" rx="4" fill="#334155"/>
    <rect x="25" y="170" width="100" height="15" rx="4" fill="#334155"/>
    
    <!-- Main content preview -->
    <rect x="160" y="65" width="405" height="100" rx="10" fill="#1E293B"/>
    <text x="180" y="100" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Welcome back, Sarah!</text>
    <text x="180" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">3 Children Enrolled • 6 Active Classes this term</text>
    
    <!-- Schedule row preview -->
    <rect x="160" y="180" width="195" height="110" rx="10" fill="#1E293B"/>
    <text x="175" y="205" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#60A5FA">Today: Chemistry Lab</text>
    <text x="175" y="230" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">10:00 AM – 11:30 AM</text>
    
    <rect x="370" y="180" width="195" height="110" rx="10" fill="#1E293B"/>
    <text x="385" y="205" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#10B981">Resource Reserved</text>
    <text x="385" y="230" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">STEM Microscope Kit #4</text>
    
    <!-- Child badges -->
    <rect x="160" y="310" width="405" height="85" rx="10" fill="#1E293B"/>
    <circle cx="190" cy="350" r="20" fill="#3B82F6"/>
    <text x="190" y="355" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">L</text>
    <text x="225" y="345" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFF">Leo (Age 10)</text>
    <text x="225" y="365" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Grade 5 • 3 Classes</text>
    
    <circle cx="350" cy="350" r="20" fill="#8B5CF6"/>
    <text x="350" y="355" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">M</text>
    <text x="385" y="345" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFF">Maya (Age 14)</text>
    <text x="385" y="365" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Grade 9 • 3 Classes</text>
  </g>
</svg>